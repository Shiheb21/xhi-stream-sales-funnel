worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ═══════════════════════════════════════════════════════════════════════════
    # XHI Reverse Proxy Configuration
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name localhost;

        # Define custom headers for proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Global health check for NGINX itself
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx"}';
        }

        # Route to API Gateway (Fastify default on port 3000)
        location /api/ {
            proxy_pass http://api-gateway:3000/;
            proxy_redirect off;
            proxy_read_timeout 90;
        }

        # Route to API Gateway explicitly for its health check
        location /api/health {
            proxy_pass http://api-gateway:3000/health;
        }

        # Route specifically to Lead Processor if needed (internal tools / stats)
        # Assuming path maps to its healthcheck endpoint
        location /processor/health {
            proxy_pass http://lead-processor:3001/health;
        }

        # Default fallback to Web Interface / API depending on future expansion
        location / {
            proxy_pass http://api-gateway:3000/;
            proxy_redirect off;
        }
    }
}
