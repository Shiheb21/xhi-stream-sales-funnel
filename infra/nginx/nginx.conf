events {
    worker_connections 1024;
}

http {
    include mime.types;

    server {
        listen 80;
        listen [::]:80;
        server_name api.xhi-stream.com app.xhi-stream.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # Route all HTTP requests to HTTPS unconditionally
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.xhi-stream.com app.xhi-stream.com;

        ssl_certificate /etc/letsencrypt/live/api.xhi-stream.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.xhi-stream.com/privkey.pem;

        # 🚨 PRODUCTION SECURITY HEADERS 🚨
        
        # HSTS (HTTP Strict Transport Security) - Force browsers to use HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # X-Frame-Options - Prevent Clickjacking (disallow embedding in an iframe)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Content Security Policy (CSP) - Hardened against XSS (allows local/socket APIs)
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none';" always;
        
        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Pass WebSocket / API Gateway
        location /api/ {
            proxy_pass http://api-gateway:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward IP specifics accurately
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
